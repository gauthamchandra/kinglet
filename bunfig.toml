[test]
# Test configuration for Bun
preload = ["./test-utils/setup.ts"]
coverage = true
coverageReporter = "text"
coverageDir = "./coverage"

# Exclude test files from coverage reports
coverageExclude = [
  "**/*.test.ts",
  "test-utils/**/*",
  "e2e/**/*"
]

# Include test files from co-located structure and test-utils directory
include = [
  "src/**/*.test.ts",
  "test-utils/**/*.test.ts"
]

[install]
# Package management configuration
frozenLockfile = false
cache = true

[build]
# Build configuration
minify = false
sourcemap = "external"

# Exclude test files and development utilities from builds
exclude = [
  "**/*.test.ts",
  "**/*.test.js",
  "test-utils/",
  "coverage/",
  "docs/",
  "*.md"
]