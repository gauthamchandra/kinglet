[test]
# Test configuration for Bun
preload = "./test-utils/setup.ts"
coverage = true
coverageReporter = "text"
coverageDir = "./coverage"

# Include test files from test-utils directory
include = [
  "src/**/*.test.ts",
  "test-utils/**/*.test.ts"
]

[install]
# Package management configuration
frozenLockfile = false
cache = true

[build]
# Build configuration
minify = false
sourcemap = "external"

# Exclude test files and development utilities from builds
exclude = [
  "**/*.test.ts",
  "**/*.spec.ts",
  "**/*.test.js",
  "**/*.spec.js",
  "test-utils/",
  "coverage/",
  "docs/",
  "*.md"
]