[test]
# Test configuration for Bun
preload = ["./test-utils/setup.ts"]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"

# NOTE: deliberately no `coverageThreshold` here. Bun applies it PER FILE, not to the
# aggregate, so any value meaningful for the project as a whole (80%+) fails on individual
# low-function-count files like src/config/schema.ts. That made plain `bun test` exit
# non-zero for every developer even with all tests passing. The 80% AGGREGATE gate this
# project actually enforces lives in scripts/check-coverage.ts and runs in CI.

# Exclude test files and non-unit harness code from coverage reports
coverageExclude = [
  "**/*.test.ts",
  "test-utils/**/*",
  "e2e/**/*",
  "terraform/**"
]

# Keep default discovery away from suites that need their own CI jobs / tooling.
# package.json scopes `test:coverage:check` to src/, test-utils/, and scripts/ because
# Bun 1.3.4 (pinned in CI) does not honor pathIgnorePatterns from bunfig.toml.
# Explicit terraform runs on Bun 1.4+ pass `--path-ignore-patterns 'e2e/**'` so only e2e
# is pruned; listing terraform/** here would suppress explicitly requested paths on 1.4+.
pathIgnorePatterns = [
  "e2e/**",
  "terraform/**"
]

# Prefer co-located + test-utils + scripts unit tests when include is honored.
include = [
  "src/**/*.test.ts",
  "test-utils/**/*.test.ts",
  "scripts/**/*.test.ts"
]

[install]
# Package management configuration
frozenLockfile = false
cache = true

[build]
# Build configuration
minify = false
sourcemap = "external"

# Exclude test files and development utilities from builds
exclude = [
  "**/*.test.ts",
  "**/*.test.js",
  "test-utils/",
  "coverage/",
  "docs/",
  "*.md"
]