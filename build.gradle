plugins {
    id 'java'
    id 'io.quarkus'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'org.openapi.generator' version '7.2.0'
    id 'jacoco'
    id "org.sonarqube" version "6.2.0.5505"
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'

    // OpenAPI generator dependencies
    implementation 'jakarta.annotation:jakarta.annotation-api'
    implementation 'jakarta.validation:jakarta.validation-api'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'

}

group = 'com.gauthamchandra'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
    finalizedBy jacocoTestReport

    // Enhanced test reporting for better JUnit-style output
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat = "full"
        showExceptions = true
        showCauses = true
        showStackTraces = true
        showStandardStreams = false

        // Display detailed information for each test
        displayGranularity = 2

        // Show detailed output on failure
        afterSuite { desc, result ->
            if (!desc.parent) { // will match the outermost suite
                def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
                def startItem = '|  ', endItem = '  |'
                def repeatLength = startItem.length() + output.length() + endItem.length()
                println('\n' + ('-' * repeatLength) + '\n' + startItem + output + endItem + '\n' + ('-' * repeatLength))
            }
        }

        // Show individual test results with timing
        afterTest { desc, result ->
            def testResult = result.resultType == TestResult.ResultType.SUCCESS ? "✓" : "✗"
            println("${testResult} ${desc.className}.${desc.name} (${result.endTime - result.startTime}ms)")
        }
    }

    // Enable parallel test execution for better performance
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1

    // Ensure tests fail fast on first failure during development
    failFast = true
}

sonar {
  properties {
    property "sonar.projectKey", "com.gauthamchandra:gcp-emulator-stack"
    property "sonar.organization", "localstack-gcp"
    property "sonar.host.url", "https://sonarcloud.io"
  }
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    executionData fileTree(dir: "$buildDir/jacoco", includes: ['**/*.exec'])
}
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}


spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat()
        indentWithSpaces(2)
        endWithNewline()
        trimTrailingWhitespace()
        toggleOffOn()
    }

    format 'misc', {
        target '**/*.gradle', '**/*.md', '**/.gitignore'
        indentWithSpaces(2)
        endWithNewline()
        trimTrailingWhitespace()
    }
}

// OpenAPI Generator configuration for Secret Manager
openApiGenerate {
    generatorName = "jaxrs-spec"
    inputSpec = "$projectDir/src/main/resources/openapi/secret-manager-v1.yaml".toString()
    outputDir = "$buildDir/generated/openapi".toString()
    apiPackage = "com.gauthamchandra.secretmanager.api"
    modelPackage = "com.gauthamchandra.secretmanager.model.generated"
    configOptions = [
        dateLibrary: "java8",
        java8: "true",
        interfaceOnly: "true",
        useTags: "true",
        generatePom: "false",
        hideGenerationTimestamp: "true",
        useJakartaEe: "true",
        useSwaggerAnnotations: "false"
    ]
}

// OpenAPI Generator configuration for Service Usage
task openApiGenerateServiceUsage(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "jaxrs-spec"
    inputSpec = "$projectDir/src/main/resources/openapi/service-usage-v1.yaml".toString()
    outputDir = "$buildDir/generated/openapi-serviceusage".toString()
    apiPackage = "com.gauthamchandra.serviceusage.api"
    modelPackage = "com.gauthamchandra.serviceusage.model.generated"
    configOptions = [
        dateLibrary: "java8",
        java8: "true",
        interfaceOnly: "true",
        useTags: "true",
        generatePom: "false",
        hideGenerationTimestamp: "true",
        useJakartaEe: "true",
        useSwaggerAnnotations: "false"
    ]
}

// Configure source sets to include generated code
sourceSets {
    main {
        java {
            srcDirs += ["$buildDir/generated/openapi/src/gen/java"]
            srcDirs += ["$buildDir/generated/openapi-serviceusage/src/gen/java"]
        }
    }
}

// Make compileJava depend on both OpenAPI generation tasks
compileJava.dependsOn tasks.openApiGenerate
compileJava.dependsOn tasks.openApiGenerateServiceUsage
