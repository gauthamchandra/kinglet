plugins {
    id 'java'
    id 'io.quarkus'
    id 'com.github.spotbugs' version '6.0.8'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'org.openapi.generator' version '7.2.0'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'

    // OpenAPI generator dependencies
    implementation 'jakarta.annotation:jakarta.annotation-api'
    implementation 'jakarta.validation:jakarta.validation-api'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
}

group 'com.gauthamchandra'
version '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

spotbugs {
    toolVersion = '4.8.3'
    excludeFilter = file('spotbugs-exclude.xml')
}

spotbugsMain {
    reports {
        html {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/main/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
    }
}

spotbugsTest {
    reports {
        html {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/test/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
    }
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat()
        indentWithSpaces(2)
        endWithNewline()
        trimTrailingWhitespace()
        toggleOffOn()
    }

    format 'misc', {
        target '**/*.gradle', '**/*.md', '**/.gitignore'
        indentWithSpaces(2)
        endWithNewline()
        trimTrailingWhitespace()
    }
}

// OpenAPI Generator configuration for Secret Manager
openApiGenerate {
    generatorName = "jaxrs-spec"
    inputSpec = "$projectDir/src/main/resources/openapi/secret-manager-v1.yaml".toString()
    outputDir = "$buildDir/generated/openapi".toString()
    apiPackage = "com.gauthamchandra.secretmanager.api"
    modelPackage = "com.gauthamchandra.secretmanager.model.generated"
    configOptions = [
        dateLibrary: "java8",
        java8: "true",
        interfaceOnly: "true",
        useTags: "true",
        generatePom: "false",
        hideGenerationTimestamp: "true",
        useJakartaEe: "true",
        useSwaggerAnnotations: "false"
    ]
}

// OpenAPI Generator configuration for Service Usage
task openApiGenerateServiceUsage(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "jaxrs-spec"
    inputSpec = "$projectDir/src/main/resources/openapi/service-usage-v1.yaml".toString()
    outputDir = "$buildDir/generated/openapi-serviceusage".toString()
    apiPackage = "com.gauthamchandra.serviceusage.api"
    modelPackage = "com.gauthamchandra.serviceusage.model.generated"
    configOptions = [
        dateLibrary: "java8",
        java8: "true",
        interfaceOnly: "true",
        useTags: "true",
        generatePom: "false",
        hideGenerationTimestamp: "true",
        useJakartaEe: "true",
        useSwaggerAnnotations: "false"
    ]
}

// Configure source sets to include generated code
sourceSets {
    main {
        java {
            srcDirs += ["$buildDir/generated/openapi/src/gen/java"]
            srcDirs += ["$buildDir/generated/openapi-serviceusage/src/gen/java"]
        }
    }
}

// Make compileJava depend on both OpenAPI generation tasks
compileJava.dependsOn tasks.openApiGenerate
compileJava.dependsOn tasks.openApiGenerateServiceUsage
