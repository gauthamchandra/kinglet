name: Sync compatibility docs

on:
  schedule:
    # Weekly on Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Refresh compatibility matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate compatibility docs from live discovery documents
        run: bun run docs:generate:compatibility

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'docs: refresh compatibility matrix from Google discovery documents'
          title: 'docs: refresh compatibility matrix'
          body: |
            Automated weekly refresh of the compatibility matrix under `docs/compatibility/`.

            Discovery documents were fetched live from the URLs in `discovery-document-registry.json` and compared against the current kinglet route table. Merge this PR to keep the published matrix aligned with Google's API surface.

            API reference pages (`docs/reference/api/`) are not updated here — those are enforced on contributor PRs via `bun run docs:check`.
          branch: docs/sync-compatibility-matrix
          delete-branch: true
          signoff: true
          labels: |
            documentation
