name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Check formatting
        run: bunx prettier --check .

      - name: Run tests with coverage
        run: bun test --coverage 2>&1 | tee coverage-output.txt || true

      - name: Check test results and coverage threshold
        run: |
          # Fail if any tests failed
          if grep -qE "^ +[1-9][0-9]* fail$" coverage-output.txt; then
            echo "::error::Tests failed"
            exit 1
          fi

          # Check coverage threshold
          THRESHOLD=80
          LINE=$(grep "All files" coverage-output.txt)
          FUNCS=$(echo "$LINE" | awk -F'|' '{gsub(/ /, "", $2); print $2}')
          LINES=$(echo "$LINE" | awk -F'|' '{gsub(/ /, "", $3); print $3}')
          echo "Function coverage: ${FUNCS}%"
          echo "Line coverage: ${LINES}%"
          FUNCS_OK=$(awk "BEGIN {print ($FUNCS >= $THRESHOLD) ? 1 : 0}")
          LINES_OK=$(awk "BEGIN {print ($LINES >= $THRESHOLD) ? 1 : 0}")
          if [ "$FUNCS_OK" -eq 0 ] || [ "$LINES_OK" -eq 0 ]; then
            echo "::error::Coverage below ${THRESHOLD}% threshold. Functions: ${FUNCS}%, Lines: ${LINES}%"
            exit 1
          fi
          echo "Coverage check passed."

      - name: Build project
        run: bun run build

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
