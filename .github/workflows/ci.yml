name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Supersede in-flight runs for the same PR. Pushes to main are never cancelled — build-docker
# publishes a sha-tagged image, and cancelling would leave that commit with no image at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    # Only meaningful on PRs — on push to main the commits are already merged.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # commitlint needs the full range between base and head.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The local husky commit-msg hook is bypassed by --no-verify and is absent entirely
      # in forks that skip `bun install`. This is the enforcement that actually holds.
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

      # Squash-merging makes the PR title the commit subject, and release-please parses it
      # to decide the version bump. A malformed title breaks the release, not just the log.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bunx commitlint --verbose

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Needed to walk every commit between base and head.
          fetch-depth: 0

      # CONTRIBUTING.md makes the sign-off carry the AI-responsibility attestation, not just
      # provenance, so it has to be enforced server-side — nothing local can be relied on.
      #
      # release-please authors its release commits as an app, and an app cannot certify the
      # DCO on anyone's behalf, so bot authors are skipped.
      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0

          while read -r sha; do
            author="$(git show -s --format='%an <%ae>' "$sha")"

            case "$author" in
              *"[bot]"*) continue ;;
            esac

            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") is missing \"Signed-off-by: $author\""
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")

          if [ "$missing" -ne 0 ]; then
            echo "Fix the last commit with:  git commit --amend -s --no-edit"
            echo "Fix the whole branch with: git rebase --signoff main"
            exit 1
          fi

          echo "All commits are signed off."

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Memorystore data-plane tests spawn a real `valkey-server` and skip themselves
      # when the binary is absent. Without this step they would skip on every run and CI
      # would report green while covering nothing — so the install is verified, not assumed
      # (test-utils/valkey.ts additionally turns a missing binary into a hard error when CI=true).
      - name: Install valkey-server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valkey-server
          valkey-server --version

      - name: Run linter
        run: bun run lint

      - name: Check generated API reference docs
        run: bun run docs:check

      - name: Check formatting
        run: bunx biome format .

      # `bun test` fails the job by itself if any test fails. The 80% AGGREGATE coverage gate
      # is separate: scripts/check-coverage.ts reads the machine-readable lcov report, because
      # bunfig's own coverageThreshold is applied per-file and the text table it prints has no
      # stable format to parse.
      - name: Run tests with coverage
        run: bun run test:coverage:check

      - name: Build project
        run: bun run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # memorystore-data-plane.test.ts connects a real Valkey client to a real spawned
      # server; it skips without this binary, which is exactly how that suite could stop
      # running unnoticed. See the matching step in the `test` job.
      - name: Install valkey-server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valkey-server
          valkey-server --version

      # e2e/ is excluded from the default `bun test` run by bunfig.toml's `include`,
      # so it needs its own job or it never runs at all.
      - name: Run E2E tests
        run: bun run test:e2e

  terraform-e2e:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # PRs do not publish a pre-built image, so this job builds kinglet locally and
      # runs terraform/ fixtures against it via google provider custom_endpoint overrides.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      - name: Run Terraform validation harness
        run: ./scripts/terraform-e2e.sh

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, e2e, terraform-e2e]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
