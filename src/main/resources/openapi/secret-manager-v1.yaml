openapi: 3.0.3
info:
  title: Google Cloud Secret Manager API
  description: API for managing secrets in Google Cloud Secret Manager
  version: v1
  contact:
    name: GCP Local Emulator
    url: https://github.com/localstack-gcp
servers:
  - url: /v1
    description: Secret Manager API v1

paths:
  /projects/{project}/secrets:
    post:
      summary: Create a new secret
      description: Creates a new secret containing no secret versions
      operationId: createSecret
      parameters:
        - name: project
          in: path
          required: true
          description: The project ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretRequest'
      responses:
        '201':
          description: Secret created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '409':
          description: Secret already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List secrets
      description: Lists secrets for a project
      operationId: listSecrets
      parameters:
        - name: project
          in: path
          required: true
          description: The project ID
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: Maximum number of secrets to return
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 100
        - name: pageToken
          in: query
          required: false
          description: Page token for pagination
          schema:
            type: string
        - name: filter
          in: query
          required: false
          description: Optional filter for secrets
          schema:
            type: string
      responses:
        '200':
          description: List of secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSecretsResponse'

  /projects/{project}/secrets/{secretId}:
    get:
      summary: Get secret metadata
      description: Gets metadata for a given secret
      operationId: getSecret
      parameters:
        - name: project
          in: path
          required: true
          description: The project ID
          schema:
            type: string
        - name: secretId
          in: path
          required: true
          description: The secret ID
          schema:
            type: string
      responses:
        '200':
          description: Secret metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update secret metadata
      description: Updates metadata of an existing secret
      operationId: updateSecret
      parameters:
        - name: project
          in: path
          required: true
          description: The project ID
          schema:
            type: string
        - name: secretId
          in: path
          required: true
          description: The secret ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecretRequest'
      responses:
        '200':
          description: Secret updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete secret
      description: Deletes a secret and all of its versions
      operationId: deleteSecret
      parameters:
        - name: project
          in: path
          required: true
          description: The project ID
          schema:
            type: string
        - name: secretId
          in: path
          required: true
          description: The secret ID
          schema:
            type: string
      responses:
        '204':
          description: Secret deleted successfully
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project}/secrets/{secretId}/addVersion:
    post:
      summary: Add a new secret version
      description: Creates a new secret version containing secret data and attaches it to an existing secret
      operationId: addSecretVersion
      parameters:
        - name: project
          in: path
          required: true
          description: The project ID
          schema:
            type: string
        - name: secretId
          in: path
          required: true
          description: The secret ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSecretVersionRequest'
      responses:
        '201':
          description: Secret version created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretVersion'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project}/secrets/{secretId}/versions:
    get:
      summary: List secret versions
      description: Lists secret versions for a given secret
      operationId: listSecretVersions
      parameters:
        - name: project
          in: path
          required: true
          description: The project ID
          schema:
            type: string
        - name: secretId
          in: path
          required: true
          description: The secret ID
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: Maximum number of versions to return
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 100
        - name: pageToken
          in: query
          required: false
          description: Page token for pagination
          schema:
            type: string
      responses:
        '200':
          description: List of secret versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSecretVersionsResponse'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project}/secrets/{secretId}/versions/{versionId}:
    get:
      summary: Get secret version metadata
      description: Gets metadata for a secret version (without accessing the payload)
      operationId: getSecretVersion
      parameters:
        - name: project
          in: path
          required: true
          description: The project ID
          schema:
            type: string
        - name: secretId
          in: path
          required: true
          description: The secret ID
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          description: The version ID (number or 'latest')
          schema:
            type: string
      responses:
        '200':
          description: Secret version metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretVersion'
        '404':
          description: Secret or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project}/secrets/{secretId}/versions/{versionId}/access:
    get:
      summary: Access a secret version
      description: Accesses a secret version's secret data
      operationId: accessSecretVersion
      parameters:
        - name: project
          in: path
          required: true
          description: The project ID
          schema:
            type: string
        - name: secretId
          in: path
          required: true
          description: The secret ID
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          description: The version ID (number or 'latest')
          schema:
            type: string
      responses:
        '200':
          description: Secret version data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessSecretVersionResponse'
        '404':
          description: Secret or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project}/secrets/{secretId}/versions/{versionId}/disable:
    post:
      summary: Disable a secret version
      description: Disables a secret version
      operationId: disableSecretVersion
      parameters:
        - name: project
          in: path
          required: true
          description: The project ID
          schema:
            type: string
        - name: secretId
          in: path
          required: true
          description: The secret ID
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          description: The version ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableSecretVersionRequest'
      responses:
        '200':
          description: Secret version disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretVersion'
        '404':
          description: Secret or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project}/secrets/{secretId}/versions/{versionId}/enable:
    post:
      summary: Enable a secret version
      description: Enables a secret version
      operationId: enableSecretVersion
      parameters:
        - name: project
          in: path
          required: true
          description: The project ID
          schema:
            type: string
        - name: secretId
          in: path
          required: true
          description: The secret ID
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          description: The version ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableSecretVersionRequest'
      responses:
        '200':
          description: Secret version enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretVersion'
        '404':
          description: Secret or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project}/secrets/{secretId}/versions/{versionId}/destroy:
    post:
      summary: Destroy a secret version
      description: Destroys a secret version (permanently deletes the secret data)
      operationId: destroySecretVersion
      parameters:
        - name: project
          in: path
          required: true
          description: The project ID
          schema:
            type: string
        - name: secretId
          in: path
          required: true
          description: The secret ID
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          description: The version ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestroySecretVersionRequest'
      responses:
        '200':
          description: Secret version destroyed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretVersion'
        '404':
          description: Secret or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    CreateSecretRequest:
      type: object
      required:
        - secretId
        - secret
      properties:
        secretId:
          type: string
          description: The ID of the secret to create
        secret:
          $ref: '#/components/schemas/SecretConfig'

    UpdateSecretRequest:
      type: object
      required:
        - secret
        - updateMask
      properties:
        secret:
          $ref: '#/components/schemas/SecretConfig'
        updateMask:
          type: string
          description: Field mask specifying which fields to update

    SecretConfig:
      type: object
      properties:
        replication:
          $ref: '#/components/schemas/ReplicationPolicy'
        labels:
          type: object
          additionalProperties:
            type: string
          description: User-provided labels

    ReplicationPolicy:
      type: object
      properties:
        automatic:
          $ref: '#/components/schemas/AutomaticReplication'
        userManaged:
          $ref: '#/components/schemas/UserManagedReplication'

    AutomaticReplication:
      type: object
      description: Automatic replication policy

    UserManagedReplication:
      type: object
      properties:
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/Replica'

    Replica:
      type: object
      properties:
        location:
          type: string
          description: The location for this replica

    Secret:
      type: object
      properties:
        name:
          type: string
          description: The resource name of the secret
        replication:
          $ref: '#/components/schemas/ReplicationPolicy'
        createTime:
          type: string
          format: date-time
          description: The time at which the secret was created
        labels:
          type: object
          additionalProperties:
            type: string
          description: User-provided labels

    ListSecretsResponse:
      type: object
      properties:
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/Secret'
          description: The list of secrets
        nextPageToken:
          type: string
          description: Token for the next page of results
        totalSize:
          type: integer
          format: int32
          description: Total number of secrets

    ListSecretVersionsResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SecretVersion'
          description: The list of secret versions
        nextPageToken:
          type: string
          description: Token for the next page of results
        totalSize:
          type: integer
          format: int32
          description: Total number of versions

    AddSecretVersionRequest:
      type: object
      required:
        - payload
      properties:
        payload:
          $ref: '#/components/schemas/SecretPayload'

    DisableSecretVersionRequest:
      type: object
      description: Request to disable a secret version

    EnableSecretVersionRequest:
      type: object
      description: Request to enable a secret version

    DestroySecretVersionRequest:
      type: object
      description: Request to destroy a secret version

    SecretPayload:
      type: object
      required:
        - data
      properties:
        data:
          type: string
          description: The secret data (base64 encoded in real GCP, but plain text for local emulation)

    SecretVersion:
      type: object
      properties:
        name:
          type: string
          description: The resource name of the secret version
        createTime:
          type: string
          format: date-time
          description: The time at which the secret version was created
        destroyTime:
          type: string
          format: date-time
          description: The time at which the secret version was destroyed
        state:
          type: string
          enum:
            - ENABLED
            - DISABLED
            - DESTROYED
          description: The current state of the secret version

    AccessSecretVersionResponse:
      type: object
      properties:
        name:
          type: string
          description: The resource name of the secret version
        payload:
          $ref: '#/components/schemas/SecretPayload'

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              format: int32
            message:
              type: string
            status:
              type: string